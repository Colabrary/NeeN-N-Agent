    async function initSoftphone() {
        try {
            const invoke = window.__TAURI__?.core?.invoke || window.__TAURI__?.tauri?.invoke;
            const raw = await invoke('fetch_softphone_config');
            sipConfig = JSON.parse(raw);
            console.log('Softphone config loaded:', sipConfig);
            document.getElementById('dialerStatus').textContent = '● Ready';
            document.getElementById('dialerStatus').style.color = '#28a745';
        } catch (e) {
            console.error('Softphone config error:', e);
            document.getElementById('dialerStatus').textContent = '● Ready (API)';
            document.getElementById('dialerStatus').style.color = '#28a745';
        }
    }

    window.makeCall = async function() {
        let number = document.getElementById('dialInput')?.value?.trim() || '';
        console.log('makeCall number:', number);
        if (!number) number = prompt('Enter phone number:');
        if (!number) return;

        // Close dialer, show call bar
        document.getElementById('dialerOverlay').style.display = 'none';
        document.getElementById('callBar').style.display = 'block';
        document.getElementById('callBarNumber').textContent = '📞 ' + number;
        document.getElementById('callBarTimer').textContent = 'Connecting...';
        document.getElementById('callBarTimer').style.color = '#28a745';

        // Load config if not loaded
        if (!sipConfig) {
            try {
                const invoke = window.__TAURI__?.core?.invoke || window.__TAURI__?.tauri?.invoke;
                const raw = await invoke('fetch_softphone_config');
                sipConfig = JSON.parse(raw);
            } catch(e) { sipConfig = null; }
        }

        if (sipConfig && sipConfig.browser_phone) {
            const bp = sipConfig.browser_phone;
            const sip = sipConfig.sip || {};
            // Build URL for our local softphone with SIP credentials
            const params = new URLSearchParams();
            params.set('mobile', number);
            params.set('sipUser', sip.username || '');
            params.set('sipPass', sip.password || '');
            params.set('server', sip.uri ? sip.uri.split('@')[1] : 'kenyavoice.rpdigitalphone.com');
            params.set('wsPort', '5000');
            params.set('wsPath', '/ws');
            params.set('fullName', sip.display_name || sip.username || '');

            // Open softphone via Tauri backend
            const url = 'softphone.html?' + params.toString();
            console.log('Opening softphone:', url);
            const invoke = window.__TAURI__?.core?.invoke || window.__TAURI__?.tauri?.invoke;
            await invoke('open_softphone_window', { url: url });
        } else {
            // Fallback: click-to-call API
            try {
                const invoke = window.__TAURI__?.core?.invoke || window.__TAURI__?.tauri?.invoke;
                await invoke('click_to_call', { customerNumber: number, leadId: null, contactId: null });
                document.getElementById('callBarTimer').textContent = 'Phone ringing...';
            } catch(e) {
                document.getElementById('callBarTimer').textContent = '❌ ' + e;
                document.getElementById('callBarTimer').style.color = '#dc3545';
            }
        }

        callStart = Date.now();
        callTimer = setInterval(async () => {
            const s = Math.floor((Date.now() - callStart) / 1000);
            document.getElementById('callBarTimer').textContent = 
                String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
            // Auto-end if softphone window closed
            try {
                const WebviewWindow = window.__TAURI__?.webviewWindow?.WebviewWindow;
                if (WebviewWindow) {
                    const w = WebviewWindow.getByLabel('softphone');
                    if (!w) endCall();
                }
            } catch(e) {}
        }, 1000);
    }


    function endCall() {
        clearInterval(callTimer);
        if (window.__ringAudio) { window.__ringAudio.pause(); window.__ringAudio = null; }
        if (window.__activePc) { window.__activePc.close(); window.__activePc = null; }
        // Send BYE on background WS to properly terminate
        if (bgWs && bgWs.readyState === 1 && window.__incomingInviteHeaders) {
            const inv = window.__incomingInviteHeaders;
            try {
                bgWs.send([`SIP/2.0 603 Decline`,`Via: ${inv.via}`,`From: ${inv.from}`,`To: ${inv.to};tag=${inv.tag}`,`Call-ID: ${inv.callId}`,`CSeq: ${inv.cseq}`,`Content-Length: 0`,'',''].join('\r\n'));
            } catch(e) {}
            window.__incomingInviteHeaders = null;
        }
        // Save to call log
        if (callStart && document.getElementById('callBarNumber')?.textContent) {
            const num = document.getElementById('callBarNumber').textContent.replace('📞 ', '').replace(' calling...', '');
            const duration = Math.floor((Date.now() - callStart) / 1000);
            saveCallLog(num, duration);
        }
        callStart = null;
        document.getElementById('callBarWebrtc').innerHTML = '';
        document.getElementById('callBar').style.display = 'none';
    }
    window.endCall = endCall;

    // ═══ CALL LOGS ═══
    function saveCallLog(number, duration) {
        const logs = JSON.parse(localStorage.getItem('neen_call_logs') || '[]');
        logs.unshift({
            number, duration,
            time: new Date().toISOString(),
            type: duration > 0 ? 'answered' : 'missed'
        });
        // Keep last 50
        localStorage.setItem('neen_call_logs', JSON.stringify(logs.slice(0, 50)));
    }

    window.showCallLogs = function() {
        const logs = JSON.parse(localStorage.getItem('neen_call_logs') || '[]');
        if (!logs.length) {
            showNotifPopup('activity_reminder', '📋 Call Logs', 'No call history yet', '');
            return;
        }
        let html = logs.slice(0, 15).map(l => {
            const d = new Date(l.time);
            const time = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            const date = d.toLocaleDateString([], {month:'short', day:'numeric'});
            const dur = l.duration > 0 ? `${Math.floor(l.duration/60)}:${String(l.duration%60).padStart(2,'0')}` : 'missed';
            const icon = l.type === 'answered' ? '📞' : '📵';
            return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.1);">
                <span>${icon} <a href="#" onclick="clickToCall('${l.number}')" style="color:#4fc3f7;text-decoration:none;">${l.number}</a></span>
                <span style="font-size:11px;color:rgba(255,255,255,0.5);">${dur} · ${date} ${time}</span>
            </div>`;
        }).join('');
        showNotifPopup('activity_reminder', '📋 Recent Calls', html, `${logs.length} total calls`);
    };

    // Click-to-call from leads opens dialer and calls
    window.clickToCall = function(phone, leadId) {
        document.getElementById('dialInput').value = phone;
        makeCall();
    };

    // ═══ INCOMING CALL LISTENER ═══
    // Keeps SIP registered in background to receive incoming calls
    let bgWs = null;
    let bgRegistered = false;

    async function startIncomingCallListener() {
        if (!sipConfig) {
            try {
                const invoke = window.__TAURI__?.core?.invoke || window.__TAURI__?.tauri?.invoke;
                const raw = await invoke('fetch_softphone_config');
                sipConfig = JSON.parse(raw);
            } catch(e) { return; }
        }
        if (!sipConfig || !sipConfig.sip) return;

        const sip = sipConfig.sip;
        const server = sip.uri ? sip.uri.split('@')[1] : 'kenyavoice.rpdigitalphone.com';
        const wsUrl = `wss://${server}:5000/ws`;
        const sipUser = sip.username;
        const sipPass = sip.password;
        const sipDomain = server;
        const fullName = sip.display_name || sipUser;
        const tag = 'bg' + Math.random().toString(36).substr(2, 8);
        const callId = 'bg' + Math.random().toString(36).substr(2, 10);
        let cseq = 1;
        let authDone = false;

        function branch() { return 'z9hG4bK' + Math.random().toString(36).substr(2, 12); }

        function connectBg() {
            console.log('BG SIP: connecting...');
            bgWs = new WebSocket(wsUrl, 'sip');
            bgWs.onopen = () => {
                console.log('BG SIP: connected, registering...');
                const msg = [
                    `REGISTER sip:${sipDomain} SIP/2.0`,
                    `Via: SIP/2.0/WSS df7jal23ls0d.invalid;branch=${branch()};rport`,
                    `From: "${fullName}" <sip:${sipUser}@${sipDomain}>;tag=${tag}`,
                    `To: <sip:${sipUser}@${sipDomain}>`,
                    `Call-ID: ${callId}`,
                    `CSeq: ${cseq++} REGISTER`,
                    `Contact: <sip:${sipUser}@df7jal23ls0d.invalid;transport=ws>;expires=600`,
                    `Max-Forwards: 70`,
                    `Content-Length: 0`, '', ''
                ].join('\r\n');
                bgWs.send(msg);
            };
            bgWs.onmessage = (e) => handleBgMsg(e.data);
            bgWs.onclose = () => {
                console.log('BG SIP: disconnected, reconnecting in 10s...');
                bgRegistered = false;
                setTimeout(connectBg, 10000);
            };
            bgWs.onerror = () => {};
        }

        function handleBgMsg(data) {
            // Handle REGISTER 401
            if (data.includes('401') && data.includes('REGISTER')) {
                if (authDone) return;
                authDone = true;
                const nonce = (data.match(/nonce="([^"]+)"/) || [])[1];
                const realm = (data.match(/realm="([^"]+)"/) || [])[1];
                if (nonce && realm) {
                    const ha1 = md5(sipUser + ':' + realm + ':' + sipPass);
                    const ha2 = md5('REGISTER:sip:' + sipDomain);
                    const resp = md5(ha1 + ':' + nonce + ':' + ha2);
                    const msg = [
                        `REGISTER sip:${sipDomain} SIP/2.0`,
                        `Via: SIP/2.0/WSS df7jal23ls0d.invalid;branch=${branch()};rport`,
                        `From: "${fullName}" <sip:${sipUser}@${sipDomain}>;tag=${tag}`,
                        `To: <sip:${sipUser}@${sipDomain}>`,
                        `Call-ID: ${callId}`,
                        `CSeq: ${cseq++} REGISTER`,
                        `Contact: <sip:${sipUser}@df7jal23ls0d.invalid;transport=ws>;expires=600`,
                        `Authorization: Digest username="${sipUser}",realm="${realm}",nonce="${nonce}",uri="sip:${sipDomain}",response="${resp}",algorithm=MD5`,
                        `Max-Forwards: 70`,
                        `Content-Length: 0`, '', ''
                    ].join('\r\n');
                    bgWs.send(msg);
                }
                return;
            }

            // Registered
            if (data.includes('200 OK') && data.includes('REGISTER')) {
                bgRegistered = true;
                console.log('BG SIP: registered ✓ listening for incoming calls');
                return;
            }

            // Respond to OPTIONS
            if (data.startsWith('OPTIONS ')) {
                const optCallId = (data.match(/Call-ID:\s*(.+)/i) || [])[1]?.trim();
                const optFrom = (data.match(/From:\s*(.+)/i) || [])[1]?.trim();
                const optTo = (data.match(/To:\s*(.+)/i) || [])[1]?.trim();
                const optVia = (data.match(/Via:\s*(.+)/i) || [])[1]?.trim();
                const optCseq = (data.match(/CSeq:\s*(.+)/i) || [])[1]?.trim();
                if (optCallId) {
                    bgWs.send([`SIP/2.0 200 OK`,`Via: ${optVia}`,`From: ${optFrom}`,`To: ${optTo}`,`Call-ID: ${optCallId}`,`CSeq: ${optCseq}`,`Content-Length: 0`,'',''].join('\r\n'));
                }
                return;
            }

            // ═══ INCOMING CALL ═══
            if (data.startsWith('INVITE ')) {
                const fromMatch = data.match(/From:\s*"?([^"<]*)"?\s*<sip:([^@>]+)/i);
                const callerName = fromMatch ? fromMatch[1].trim() : '';
                const callerNumber = fromMatch ? fromMatch[2] : 'Unknown';
                console.log('BG SIP: INCOMING CALL from', callerNumber, callerName);

                // Send 180 Ringing
                const invCallId = (data.match(/Call-ID:\s*(.+)/i) || [])[1]?.trim();
                const invFrom = (data.match(/From:\s*(.+)/i) || [])[1]?.trim();
                const invTo = (data.match(/To:\s*(.+)/i) || [])[1]?.trim();
                const invVia = (data.match(/Via:\s*(.+)/i) || [])[1]?.trim();
                const invCseq = (data.match(/CSeq:\s*(.+)/i) || [])[1]?.trim();
                bgWs.send([`SIP/2.0 180 Ringing`,`Via: ${invVia}`,`From: ${invFrom}`,`To: ${invTo};tag=${tag}`,`Call-ID: ${invCallId}`,`CSeq: ${invCseq}`,`Content-Length: 0`,'',''].join('\r\n'));

                // Show incoming call notification + native toast
                showNativeToast('Incoming Call', `${callerName || callerNumber} is calling...`);
                showIncomingCallUI(callerNumber, callerName, data);
            }
        }

        // Load MD5 for background auth
        if (typeof md5 === 'undefined') {
            const s = document.createElement('script');
            s.src = 'https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js';
            s.onload = connectBg;
            document.head.appendChild(s);
        } else {
            connectBg();
        }
    }

    function showIncomingCallUI(number, name, inviteData) {
        // Store INVITE SDP and headers for answering
        const sdpParts = inviteData.split('\r\n\r\n');
        window.__incomingInviteSdp = sdpParts[1] || '';
        window.__incomingInviteHeaders = {
            via: (inviteData.match(/Via:\s*(.+)/i) || [])[1]?.trim() || '',
            from: (inviteData.match(/From:\s*(.+)/i) || [])[1]?.trim() || '',
            to: (inviteData.match(/To:\s*(.+)/i) || [])[1]?.trim() || '',
            callId: (inviteData.match(/Call-ID:\s*(.+)/i) || [])[1]?.trim() || '',
            cseq: (inviteData.match(/CSeq:\s*(.+)/i) || [])[1]?.trim() || '',
            tag: 'bg' + Math.random().toString(36).substr(2, 8)
        };

        // Show call bar with Accept/Reject
        document.getElementById('callBar').style.display = 'block';
        document.getElementById('callBarNumber').textContent = '📞 ' + (name || number) + ' calling...';
        document.getElementById('callBarTimer').textContent = 'Incoming Call';
        document.getElementById('callBarTimer').style.color = '#ffc107';
        document.getElementById('callBarWebrtc').innerHTML = `
            <div style="display:flex;gap:10px;justify-content:center;margin:10px 0;">
                <button onclick="acceptIncomingCall('${number}')" style="flex:1;padding:12px;border-radius:10px;border:none;background:#28a745;color:white;font-size:16px;font-weight:700;cursor:pointer;">✓ Accept</button>
                <button onclick="rejectIncomingCall()" style="flex:1;padding:12px;border-radius:10px;border:none;background:#dc3545;color:white;font-size:16px;font-weight:700;cursor:pointer;">✕ Reject</button>
            </div>`;

        // Play ring sound
        try {
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 440; gain.gain.value = 0.3;
            osc.start();
            window.__ringAudio = { pause: () => { osc.stop(); ctx.close(); } };
        } catch(e) {}
    }

    window.acceptIncomingCall = async function(number) {
        // Stop ring
        if (window.__ringAudio) { window.__ringAudio.pause(); window.__ringAudio = null; }
        document.getElementById('callBarWebrtc').innerHTML = '';
        document.getElementById('callBarNumber').textContent = '📞 ' + number;
        document.getElementById('callBarTimer').textContent = 'Connected';
        document.getElementById('callBarTimer').style.color = '#28a745';

        // Answer the call on background WS with WebRTC audio
        try {
            const pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
            const stream = await navigator.mediaDevices.getUserMedia({audio:true});
            stream.getTracks().forEach(t => pc.addTrack(t, stream));

            // Remote audio
            const audio = new Audio(); audio.autoplay = true;
            pc.ontrack = (e) => { audio.srcObject = e.streams[0]; };

            // Set remote SDP from INVITE
            const inviteSdp = window.__incomingInviteSdp;
            if (inviteSdp) {
                await pc.setRemoteDescription(new RTCSessionDescription({type:'offer', sdp: inviteSdp}));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                await new Promise(r => { pc.onicecandidate = e => { if(!e.candidate) r(); }; setTimeout(r, 2000); });

                // Send 200 OK with SDP
                const sdp = pc.localDescription.sdp;
                const inv = window.__incomingInviteHeaders;
                bgWs.send([
                    `SIP/2.0 200 OK`,
                    `Via: ${inv.via}`,
                    `From: ${inv.from}`,
                    `To: ${inv.to};tag=${inv.tag}`,
                    `Call-ID: ${inv.callId}`,
                    `CSeq: ${inv.cseq}`,
                    `Contact: <sip:${sipConfig.sip.username}@df7jal23ls0d.invalid;transport=ws>`,
                    `Content-Type: application/sdp`,
                    `Content-Length: ${sdp.length}`,
                    '', sdp
                ].join('\r\n'));

                window.__activePc = pc;
                window.__activeAudio = audio;

                // Start timer
                callStart = Date.now();
                callTimer = setInterval(() => {
                    const s = Math.floor((Date.now() - callStart) / 1000);
                    document.getElementById('callBarTimer').textContent = 
                        String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
                }, 1000);
            }
        } catch(e) {
            console.error('Accept call error:', e);
            document.getElementById('callBarTimer').textContent = '❌ ' + e.message;
        }
    };

    window.rejectIncomingCall = function() {
        if (window.__ringAudio) { window.__ringAudio.pause(); window.__ringAudio = null; }
        // Send 603 Decline
        const inv = window.__incomingInviteHeaders;
        if (inv && bgWs) {
            bgWs.send([`SIP/2.0 603 Decline`,`Via: ${inv.via}`,`From: ${inv.from}`,`To: ${inv.to};tag=${inv.tag}`,`Call-ID: ${inv.callId}`,`CSeq: ${inv.cseq}`,`Content-Length: 0`,'',''].join('\r\n'));
        }
        endCall();
    };

    // Start incoming call listener after config loads
    setTimeout(startIncomingCallListener, 5000);
    </script>
